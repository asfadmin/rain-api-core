[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[project]
name = "rain-api-core"
version = "0.1.0"
description = "RAIN API Core"
readme = "README.md"
authors = [
    { name = "Rohan Weeden", email = "reweeden@alaska.edu" }
]
requires-python = "~=3.10"
dependencies = [
    "cachetools~=5.0",
    "jinja2~=3.0",
    "netaddr~=1.0",
    "pyjwt[crypto]~=2.0",
    "pyyaml~=6.0",
]

[dependency-groups]
dev = [
    "boto3~=1.35",
    "hypothesis~=6.112",
    "moto~=5.0",
    "pytest~=8.3",
    "pytest-cov~=5.0",
    "pytest-mock~=3.14",
]
